<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pigment Pantry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#1B1815;
  --panel:#242019;
  --panel-raised:#2C2720;
  --seam:#3A342A;
  --parchment:#EDE6D6;
  --muted:#A89C87;
  --brass:#C9A227;
  --brass-dim:#8f7420;
  --teal:#3E6259;
  --teal-bright:#5C9186;
  --full:#6B8F4E;
  --low:#C9A227;
  --empty:#A83C3C;
  --wishlist:#3E6259;
  --focus:#D4B24C;
  --on-accent:#1A1512;
}

:root[data-theme="rose"]{
  --ink:#151316;
  --panel:#211D21;
  --panel-raised:#2A242A;
  --seam:#3A323A;
  --parchment:#EDE6E9;
  --muted:#B08099;
  --brass:#B1508A;
  --brass-dim:#7C3A5F;
  --focus:#D98CB0;
}

:root[data-theme="offwhite"]{
  --ink:#F4F0E8;
  --panel:#FFFFFF;
  --panel-raised:#FAF7F1;
  --seam:#DEDACE;
  --parchment:#2A241E;
  --muted:#7A7062;
  --brass:#A8763A;
  --brass-dim:#7A5527;
  --focus:#C08F4A;
}

:root[data-theme="teal"]{
  --ink:#12211F;
  --panel:#1A2E2B;
  --panel-raised:#223A34;
  --seam:#2E4A43;
  --parchment:#E8EDE9;
  --muted:#7FA89B;
  --brass:#C9A227;
  --brass-dim:#8f7420;
  --focus:#D4B24C;
}

:root[data-theme="terracotta"]{
  --ink:#211714;
  --panel:#2E211C;
  --panel-raised:#372820;
  --seam:#4A362B;
  --parchment:#F0E4D8;
  --muted:#C08A5F;
  --brass:#C67C3A;
  --brass-dim:#8F5726;
  --focus:#D9975A;
}

:root[data-theme="sage"]{
  --ink:#191D15;
  --panel:#232B1D;
  --panel-raised:#2B3524;
  --seam:#3A4530;
  --parchment:#E7ECDD;
  --muted:#9BAF7A;
  --brass:#7FA05A;
  --brass-dim:#5C7A3E;
  --focus:#9BC26E;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding:28px 20px 80px;
}

::selection{background:var(--brass);color:var(--on-accent);}

/* subtle woodgrain-ish texture via layered gradients */
body{
  background-image:
    radial-gradient(ellipse at top left, rgba(201,162,39,0.05), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(62,98,89,0.06), transparent 55%);
}

.wrap{max-width:880px;margin:0 auto;}

/* ---------- Header ---------- */
header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  border-bottom:2px solid var(--seam);
  padding-bottom:18px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.theme-picker{
  display:flex;
  align-items:center;
  gap:7px;
  margin:-8px 0 18px;
}
.theme-picker-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  margin-right:2px;
}
.theme-swatch{
  width:18px;
  height:18px;
  border-radius:50%;
  border:1.5px solid var(--seam);
  padding:0;
  cursor:pointer;
  transition:transform .1s ease, border-color .12s ease;
}
.theme-swatch:hover{transform:scale(1.12);}
.theme-swatch.active{
  border-color:var(--parchment);
  box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--brass);
}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:36px;
  letter-spacing:0.5px;
  margin:0;
  color:var(--parchment);
  display:flex;
  align-items:center;
  gap:12px;
}
h1 .pot-mark{
  width:26px;height:32px;flex-shrink:0;
}
.tagline{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  letter-spacing:0.3px;
}
.stats{
  display:flex;
  gap:18px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
}
.stat{text-align:right;}
.stat b{
  display:block;
  font-family:'Oswald',sans-serif;
  font-size:22px;
  color:var(--brass);
  font-weight:600;
}

/* ---------- Controls ---------- */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
input,select,textarea{
  font-family:'Inter',sans-serif;
  background:var(--panel);
  border:1px solid var(--seam);
  color:var(--parchment);
  border-radius:6px;
  padding:9px 12px;
  font-size:14px;
  outline:none;
}
input::placeholder{color:var(--muted);}
input:focus,select:focus,textarea:focus{
  border-color:var(--focus);
  box-shadow:0 0 0 3px rgba(212,178,76,0.15);
}
#search{flex:1;min-width:180px;}
select#filterBrand,select#filterStatus{min-width:130px;}

.group-toggle{
  display:flex;
  border:1px solid var(--seam);
  border-radius:6px;
  overflow:hidden;
}
.group-toggle button{
  font-family:'Oswald',sans-serif;
  font-weight:500;
  font-size:13px;
  letter-spacing:0.2px;
  background:var(--panel);
  color:var(--muted);
  border:none;
  padding:9px 14px;
  cursor:pointer;
}
.group-toggle button + button{border-left:1px solid var(--seam);}
.group-toggle button.active{background:var(--brass);color:var(--on-accent);}
.group-toggle button:not(.active):hover{color:var(--parchment);}

.family-dot{
  width:11px;height:11px;
  border-radius:50%;
  flex-shrink:0;
  border:1px solid rgba(0,0,0,0.3);
}

.btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:0.3px;
  border:none;
  border-radius:6px;
  padding:10px 18px;
  font-size:14px;
  cursor:pointer;
  transition:transform .08s ease, filter .12s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--brass);color:var(--on-accent);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--seam);color:var(--parchment);}
.btn-ghost:hover{border-color:var(--brass);}

/* ---------- Add form ---------- */
#addForm{
  display:none;
  background:var(--panel);
  border:1px solid var(--seam);
  border-radius:10px;
  padding:18px;
  margin-bottom:22px;
}
#addForm.open{display:block;}
#addForm h3{
  margin:0 0 14px;
  font-family:'Oswald',sans-serif;
  font-size:16px;
  color:var(--brass);
  text-transform:uppercase;
  letter-spacing:1px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.form-grid .full{grid-column:1/-1;}
.form-grid label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
  display:block;
  margin-bottom:4px;
}
.form-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
  justify-content:flex-end;
}
.color-row{display:flex;align-items:center;gap:8px;}
input[type=color]{
  width:44px;height:38px;padding:2px;background:var(--panel-raised);cursor:pointer;
}
input[type=color]:disabled,input:disabled,select:disabled{
  opacity:0.35;
  cursor:not-allowed;
}
.lookup-status{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  margin-top:5px;
  min-height:14px;
}
.lookup-status.match{color:var(--full);}
.lookup-status.nomatch{color:var(--muted);}

/* ---------- Shelves (brand groups) ---------- */
.shelf{margin-bottom:16px;}
.shelf-head{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  padding:8px 0;
  border-bottom:1px solid var(--seam);
  user-select:none;
}
.shelf-head .chev{
  color:var(--brass);
  transition:transform .15s ease;
  font-size:11px;
}
.shelf.collapsed .chev{transform:rotate(-90deg);}
.shelf-head h2{
  font-family:'Oswald',sans-serif;
  font-size:18px;
  font-weight:600;
  margin:0;
  letter-spacing:0.3px;
}
.shelf-head .count{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-left:auto;
}
.shelf-body{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:10px;
  padding:12px 0 4px;
}
.shelf.collapsed .shelf-body{display:none;}

/* ---------- Paint pot card ---------- */
.pot-card{
  background:var(--panel);
  border:1px solid var(--seam);
  border-radius:8px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
  transition:border-color .12s ease, background .12s ease;
}
.pot-card:hover{border-color:var(--brass-dim);background:var(--panel-raised);}

.pot-icon{flex-shrink:0;width:22px;height:28px;}
.pot-info{flex:1;min-width:0;}
.pot-name{
  font-size:14px;
  font-weight:500;
  color:var(--parchment);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#storageWarning{
  background:rgba(168,60,60,0.1);
  border:1px solid rgba(168,60,60,0.35);
  color:var(--parchment);
  padding:12px 16px;
  border-radius:8px;
  font-size:12.5px;
  line-height:1.6;
  margin-bottom:18px;
}
#storageWarning strong{color:var(--empty);}

.metallic-mark{color:var(--brass);margin-right:4px;}
.wash-mark{color:var(--teal-bright);margin-right:4px;}
.technical-mark{color:var(--muted);margin-right:4px;}
.pot-line{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  margin-top:1px;
}
.pot-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}
.status-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  padding:3px 8px;
  border-radius:20px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  white-space:nowrap;
  border:1px solid transparent;
}
.status-full{background:rgba(107,143,78,0.18);color:var(--full);border-color:rgba(107,143,78,0.4);}
.status-low{background:rgba(201,162,39,0.18);color:var(--low);border-color:rgba(201,162,39,0.4);}
.status-empty{background:rgba(168,60,60,0.18);color:var(--empty);border-color:rgba(168,60,60,0.4);}
.status-wishlist{background:rgba(62,98,89,0.22);color:var(--teal-bright);border-color:rgba(62,98,89,0.5);}

.icon-btn{
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:14px;
  padding:2px 4px;
  border-radius:4px;
  line-height:1;
}
.icon-btn:hover{color:var(--parchment);background:var(--seam);}

.pot-notes{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  font-style:italic;
}

/* ---------- Empty state ---------- */
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state .pot-mark{width:40px;height:50px;margin:0 auto 14px;opacity:0.6;}
.empty-state h3{
  font-family:'Oswald',sans-serif;
  color:var(--parchment);
  font-weight:500;
  margin:0 0 6px;
}
.empty-state p{font-size:13px;margin:0;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--brass);
  color:var(--on-accent);
  padding:10px 18px;
  border-radius:6px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:50;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:520px){
  .form-grid{grid-template-columns:1fr;}
  h1{font-size:28px;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>
        <svg class="pot-mark" viewBox="0 0 26 32" fill="none">
          <rect x="3" y="10" width="20" height="20" rx="2" fill="var(--panel-raised)" stroke="var(--brass)" stroke-width="1.5"/>
          <rect x="6" y="3" width="14" height="8" rx="1.5" fill="var(--brass)"/>
          <rect x="8" y="16" width="10" height="4" rx="1" fill="var(--teal)"/>
        </svg>
        Pigment Pantry
      </h1>
      <div class="tagline">know what's on the shelf before you buy it twice</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b>total</div>
      <div class="stat"><b id="statLow">0</b>low</div>
      <div class="stat"><b id="statEmpty">0</b>empty</div>
      <div class="stat"><b id="statWish">0</b>wishlist</div>
    </div>
  </header>

  <div class="theme-picker" id="themePicker">
    <span class="theme-picker-label">theme</span>
    <button class="theme-swatch" data-theme="charcoal" title="Charcoal" style="background:linear-gradient(135deg,#1B1815 50%,#C9A227 50%);"></button>
    <button class="theme-swatch" data-theme="offwhite" title="Off-white" style="background:linear-gradient(135deg,#F4F0E8 50%,#A8763A 50%);"></button>
    <button class="theme-swatch" data-theme="rose" title="Ink &amp; Rose" style="background:linear-gradient(135deg,#151316 50%,#B1508A 50%);"></button>
    <button class="theme-swatch" data-theme="teal" title="Museum teal" style="background:linear-gradient(135deg,#12211F 50%,#C9A227 50%);"></button>
    <button class="theme-swatch" data-theme="terracotta" title="Terracotta studio" style="background:linear-gradient(135deg,#211714 50%,#C67C3A 50%);"></button>
    <button class="theme-swatch" data-theme="sage" title="Botanical sage" style="background:linear-gradient(135deg,#191D15 50%,#7FA05A 50%);"></button>
  </div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search by name, brand, or line…" />
    <select id="filterBrand"><option value="">All brands</option></select>
    <select id="filterStatus">
      <option value="">All statuses</option>
      <option value="full">Full</option>
      <option value="low">Low</option>
      <option value="empty">Empty</option>
      <option value="wishlist">Wishlist</option>
    </select>
    <button class="btn btn-primary" id="toggleForm">+ Add paint</button>
  </div>

  <div class="controls" style="margin-top:-10px;">
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);align-self:center;">group by</span>
    <div class="group-toggle">
      <button class="active" data-mode="brand" id="groupBrandBtn">Brand</button>
      <button data-mode="color" id="groupColorBtn">Color</button>
    </div>
    <span style="flex:1;"></span>
    <button class="btn btn-ghost" id="exportBtn" type="button" title="Download your collection as a backup file">⬇ Export</button>
    <button class="btn btn-ghost" id="importBtn" type="button" title="Restore from a previously exported file">⬆ Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;" />
  </div>
  <div id="storageWarning" style="display:none;"></div>

  <form id="addForm" novalidate>
    <h3 id="formTitle">Add a paint</h3>
    <div class="form-grid">
      <div>
        <label>Name</label>
        <input id="fName" type="text" placeholder="e.g. Balthasar Gold" required />
      </div>
      <div>
        <label>Brand</label>
        <input id="fBrand" list="brandList" type="text" placeholder="e.g. Citadel" required />
        <datalist id="brandList"></datalist>
      </div>
      <div>
        <label>Line (shorthand if you use one)</label>
        <input id="fLine" type="text" placeholder="e.g. VGC, Base, Contrast" />
      </div>
      <div>
        <label>Model / part number (optional)</label>
        <input id="fPartNo" type="text" placeholder="e.g. 72.029" />
        <div class="lookup-status" id="lookupStatus"></div>
      </div>
      <div>
        <label>Status</label>
        <select id="fStatus">
          <option value="full">Full</option>
          <option value="low">Low</option>
          <option value="empty">Empty</option>
          <option value="wishlist">Wishlist</option>
        </select>
      </div>
      <div>
        <label>Swatch color</label>
        <div class="color-row">
          <input id="fColor" type="color" value="#c9a227" />
          <input id="fColorHex" type="text" value="#c9a227" style="width:90px;font-family:'JetBrains Mono',monospace;font-size:12px;" />
        </div>
      </div>
      <div>
        <label>Finish type</label>
        <select id="fFinish">
          <option value="standard">Standard (use swatch)</option>
          <option value="metallic">Metallic</option>
          <option value="wash">Wash / Shade</option>
          <option value="technical">Technical / Basing (texture, mediums, effects)</option>
        </select>
      </div>
      <div class="full">
        <label>Notes (optional)</label>
        <input id="fNotes" type="text" placeholder="e.g. main metal tone for Chaos Dwarf trim" />
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="cancelForm">Cancel</button>
      <button type="submit" class="btn btn-primary" id="saveBtn">Save paint</button>
    </div>
  </form>

  <div id="shelves"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <svg class="pot-mark" viewBox="0 0 26 32" fill="none">
      <rect x="3" y="10" width="20" height="20" rx="2" fill="var(--panel-raised)" stroke="var(--brass)" stroke-width="1.5"/>
      <rect x="6" y="3" width="14" height="8" rx="1.5" fill="var(--brass)"/>
    </svg>
    <h3>The shelf is empty</h3>
    <p>Add your first paint, or a paint you're eyeing but don't own yet.</p>
  </div>

</div>
<div id="toast"></div>

<script>
const STORAGE_KEY = 'paints';
let paints = [];
let editingId = null;

/* ---------- Vallejo part-number lookup ---------- */
/* Compiled from Vallejo's official color chart PDFs (Game/Xpress Color,
   Model Color, True Metallic Metal, Metal Color). Covers the ranges Mason
   draws from most; not guaranteed 100% exhaustive for rarer/auxiliary refs. */
const VALLEJO_DB = {};
function addEntries(line, obj){
  for(const ref in obj) VALLEJO_DB[ref] = {line, name: obj[ref]};
}

// VGC — Game Color
addEntries('VGC', {
  "72.001":"Dead White","72.034":"Bone White","72.003":"Pale Flesh","72.100":"Rosy Flesh",
  "72.107":"Athena Skin","72.004":"Elf Skin Tone","72.071":"Barbarian Skin","72.109":"Toxic Yellow",
  "72.005":"Moon Yellow","72.006":"Sun Yellow","72.007":"Gold Yellow","72.038":"Scrofulous Brown",
  "72.008":"Orange Fire","72.009":"Hot Orange","72.010":"Bloody Red","72.012":"Scarlet Red",
  "72.011":"Gory Red","72.111":"Nocturnal Red","72.013":"Squid Pink","72.014":"Warlord Purple",
  "72.114":"Lustful Purple","72.076":"Alien Purple","72.015":"Hexed Lichen","72.016":"Royal Purple",
  "72.116":"Midnight Purple","72.117":"Elfic Blue","72.022":"Ultramarine Blue","72.019":"Night Blue",
  "72.118":"Sunrise Blue","72.023":"Electric Blue","72.021":"Magic Blue","72.020":"Imperial Blue",
  "72.024":"Turquoise","72.120":"Abyssal Turquoise","72.121":"Ghost Green","72.025":"Foul Green",
  "72.026":"Jade Green","72.027":"Scurvy Green","72.122":"Bile Green","72.032":"Scorpy Green",
  "72.030":"Goblin Green","72.029":"Sick Green","72.123":"Angel Green","72.028":"Dark Green",
  "72.035":"Dead Flesh","72.031":"Camouflage Green","72.145":"Dirty Grey","72.067":"Cayman Green",
  "72.061":"Khaki","72.063":"Desert Yellow","72.062":"Earth","72.036":"Bronze Brown",
  "72.039":"Plague Brown","72.040":"Leather Brown","72.043":"Beasty Brown","72.042":"Parasite Brown",
  "72.124":"Gorgone Brown","72.044":"Dark Fleshtone","72.045":"Charred Brown","72.047":"Wolf Grey",
  "72.048":"Sombre Grey","72.148":"Warm Grey","72.049":"Stonewall Grey","72.050":"Neutral Grey",
  "72.155":"Charcoal","72.051":"Black","72.098":"Elfic Flesh","72.101":"Off-White",
  "72.099":"Skin Tone","72.108":"Succubus Skin","72.113":"Deep Magenta","72.110":"Sunset Orange",
  "72.096":"Verdigris","72.119":"Aquamarine","72.115":"Grunge Brown","72.066":"Tan",
  "72.106":"Scarlet Blood","72.112":"Evil Red"
});

// Game Color Wash
addEntries('Game Color Wash', {
  "73.200":"Sepia","73.201":"Black","73.203":"Umber","73.204":"Flesh",
  "73.206":"Red","73.207":"Blue","73.208":"Yellow","73.209":"Violet"
});

// Game Color Metallic
addEntries('Game Color Metallic', {
  "72.052":"Silver","72.053":"Chainmail","72.054":"Dark Gunmetal","72.055":"Polished Gold",
  "72.056":"Glorious Gold","72.057":"Bright Bronze","72.058":"Brassy Brass","72.059":"Hammered Copper",
  "72.060":"Tinny Tin"
});

function normalizePartNo(raw){
  return (raw || '').trim();
}
function lookupVallejo(raw){
  const s = normalizePartNo(raw);
  if(!s) return null;
  if(VALLEJO_DB[s]) return VALLEJO_DB[s];
  const digits = s.replace(/[^\d]/g,'');
  if(digits.length === 5){
    const candidate = digits.slice(0,2) + '.' + digits.slice(2);
    if(VALLEJO_DB[candidate]) return VALLEJO_DB[candidate];
  }
  return null;
}

const FAMILY_ORDER = ['Metallic','Wash','Technical','Red','Orange','Brown','Yellow','Green','Teal / Cyan','Blue','Purple','Pink / Magenta','White / Cream','Grey','Black'];
const FAMILY_DOT = {
  'Metallic':'linear-gradient(135deg, #efe9d8 0%, #8a8a8a 35%, #c9a227 65%, #4a4030 100%)',

  'White / Cream':'#e8e2d4','Grey':'#8a8a8a','Black':'#232019'

function hexToHSL(hex){
  let h = (hex || '#888888').replace('#','');
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  const r = parseInt(h.substr(0,2),16)/255, g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let hh, s, l = (max+min)/2;
  if(max === min){ hh = 0; s = 0; }
  else{
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: hh = (g-b)/d + (g<b?6:0); break;
      case g: hh = (b-r)/d + 2; break;
      default: hh = (r-g)/d + 4;
    }
    hh *= 60;
  }
  return {h:hh, s:s*100, l:l*100};
}

function colorFamily(hex){
  const {h, s, l} = hexToHSL(hex);
  if(l >= 92) return 'White / Cream';
  if(l <= 9) return 'Black';
  if(s <= 14) return 'Grey';
  if(h < 20) return 'Red';
  if(h < 45) return l < 42 ? 'Brown' : 'Orange';
  if(h < 65) return 'Yellow';
  if(h < 170) return 'Green';
  if(h < 195) return 'Teal / Cyan';
  if(h < 255) return 'Blue';
  if(h < 290) return 'Purple';
  if(h < 345) return 'Pink / Magenta';
  return 'Red';
}

let storageAvailable = true;
let usingLocalStorage = false;

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

const THEME_KEY = 'theme';

async function loadThemePref(){
  try{
    if(hasClaudeStorage()){
      const res = await window.storage.get(THEME_KEY, false);
      return res ? res.value : null;
    }
    return localStorage.getItem(THEME_KEY);
  }catch(e){
    return null;
  }
}

async function saveThemePref(name){
  try{
    if(hasClaudeStorage()){
      await window.storage.set(THEME_KEY, name, false);
    }else{
      localStorage.setItem(THEME_KEY, name);
    }
  }catch(e){
    // cosmetic preference only — fine to silently drop
  }
}

function applyTheme(name){
  if(name && name !== 'charcoal'){
    document.documentElement.setAttribute('data-theme', name);
  }else{
    document.documentElement.removeAttribute('data-theme');
    name = 'charcoal';
  }
  document.querySelectorAll('.theme-swatch').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.theme === name);
  });
}

async function initTheme(){
  const saved = await loadThemePref();
  applyTheme(saved || 'charcoal');
  document.querySelectorAll('.theme-swatch').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name = btn.dataset.theme;
      applyTheme(name);
      await saveThemePref(name);
    });
  });
}

async function verifyStorageWorks(){
  const testKey = '__paint_locker_canary__';
  const testVal = 'ok_' + Date.now();
  try{
    await window.storage.set(testKey, testVal, false);
    const res = await window.storage.get(testKey, false);
    return !!res && res.value === testVal;
  }catch(e){
    return false;
  }
}

function showStorageWarning(){
  const el = document.getElementById('storageWarning');
  el.style.display = 'block';
  el.innerHTML = '⚠ Persistent storage isn\'t active for this file right now, so paints won\'t survive a reload. This usually means the artifact needs to be <strong>Published</strong> first (look near the top of this panel). Until then, use <strong>Export</strong> after adding paints, and <strong>Import</strong> to bring them back next session.';
}

async function loadPaints(){
  if(hasClaudeStorage()){
    // Running inside Claude's artifact preview — use its storage API.
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      paints = res ? JSON.parse(res.value) : [];
    }catch(e){
      paints = [];
    }
    storageAvailable = await verifyStorageWorks();
    if(!storageAvailable) showStorageWarning();
  }else{
    // Running standalone (opened directly, hosted, shared) — real browser
    // localStorage works fine here, since the Claude-specific restriction
    // doesn't apply outside Claude's sandboxed preview.
    usingLocalStorage = true;
    storageAvailable = true;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      paints = raw ? JSON.parse(raw) : [];
    }catch(e){
      paints = [];
      storageAvailable = false;
      showStorageWarning();
    }
  }

  // migrate legacy boolean "metallic" field to the newer "finish" field
  let migrated = false;
  paints.forEach(p=>{
    if(!p.finish){
      p.finish = p.metallic ? 'metallic' : 'standard';
      delete p.metallic;
      migrated = true;
    }
  });
  if(migrated && storageAvailable) savePaints();

  render();
}

async function savePaints(){
  if(usingLocalStorage){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(paints));
    }catch(e){
      showToast('Save failed — try again');
    }
    return;
  }
  if(!storageAvailable) return; // known unavailable — rely on Export/Import instead
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(paints), false);
  }catch(e){
    showToast('Save failed — try again');
  }
}

function getFilters(){
  return {
    q: document.getElementById('search').value.trim().toLowerCase(),
    brand: document.getElementById('filterBrand').value,
    status: document.getElementById('filterStatus').value
  };
}

function populateBrandFilter(){
  const sel = document.getElementById('filterBrand');
  const current = sel.value;
  const brands = [...new Set(paints.map(p=>p.brand))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '<option value="">All brands</option>' + brands.map(b=>`<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
  sel.value = brands.includes(current) ? current : '';

  const dl = document.getElementById('brandList');
  dl.innerHTML = brands.map(b=>`<option value="${escapeHtml(b)}"></option>`).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateStats(){
  document.getElementById('statTotal').textContent = paints.length;
  document.getElementById('statLow').textContent = paints.filter(p=>p.status==='low').length;
  document.getElementById('statEmpty').textContent = paints.filter(p=>p.status==='empty').length;
  document.getElementById('statWish').textContent = paints.filter(p=>p.status==='wishlist').length;
}

let groupMode = 'brand';

function render(){
  populateBrandFilter();
  updateStats();

  const {q, brand, status} = getFilters();
  let filtered = paints.filter(p=>{
    if(brand && p.brand !== brand) return false;
    if(status && p.status !== status) return false;
    if(q){
      const hay = (p.name+' '+p.brand+' '+p.line+' '+(p.partNo||'')+' '+(p.notes||'')+' '+(p.finish && p.finish!=='standard' ? p.finish : '')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const container = document.getElementById('shelves');
  const emptyState = document.getElementById('emptyState');

  if(filtered.length === 0){
    container.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.querySelector('p').textContent = paints.length === 0
      ? "Add your first paint, or a paint you're eyeing but don't own yet."
      : "Nothing matches that search or filter.";
    return;
  }
  emptyState.style.display = 'none';

  const groups = {};
  filtered.forEach(p=>{
    const key = groupMode === 'color'
      ? (p.finish && p.finish !== 'standard' ? p.finish[0].toUpperCase() + p.finish.slice(1) : colorFamily(p.color))
      : p.brand;
    (groups[key] = groups[key] || []).push(p);
  });

  const groupNames = groupMode === 'color'
    ? FAMILY_ORDER.filter(f=>groups[f])
    : Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  container.innerHTML = groupNames.map(groupName=>{
    const items = groups[groupName].sort((a,b)=>
      groupMode === 'color'
        ? (a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name))
        : a.name.localeCompare(b.name)
    );
    const cards = items.map(p=>`
      <div class="pot-card" data-id="${p.id}">
        ${potIconSVG(p)}
        <div class="pot-info">
          <div class="pot-name">${finishMarkHTML(p.finish)}${escapeHtml(p.name)}</div>
          <div class="pot-line">${
            (groupMode === 'color' ? [p.brand] : []).concat([p.partNo, p.line]).filter(Boolean).map(escapeHtml).join(' · ') || '—'
          }</div>
          ${p.notes ? `<div class="pot-notes">${escapeHtml(p.notes)}</div>` : ''}
        </div>
        <div class="pot-actions">
          <span class="status-pill status-${p.status}">${statusLabel(p.status)}</span>
          <button class="icon-btn edit-btn" title="Edit" data-id="${p.id}">✎</button>
          <button class="icon-btn del-btn" title="Delete" data-id="${p.id}">✕</button>
        </div>
      </div>
    `).join('');

    const dot = groupMode === 'color'
      ? `<span class="family-dot" style="background:${FAMILY_DOT[groupName] || '#8a8a8a'}"></span>`
      : '';

    return `
      <div class="shelf">
        <div class="shelf-head" data-group="${escapeHtml(groupName)}">
          <span class="chev">▾</span>
          ${dot}
          <h2>${escapeHtml(groupName)}</h2>
          <span class="count">${items.length} paint${items.length===1?'':'s'}</span>
        </div>
        <div class="shelf-body">${cards}</div>
      </div>
    `;
  }).join('');

  // wire up events
  container.querySelectorAll('.shelf-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      h.parentElement.classList.toggle('collapsed');
    });
  });
  container.querySelectorAll('.edit-btn').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      openEdit(b.dataset.id);
    });
  });
  container.querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const p = paints.find(x=>x.id===b.dataset.id);
      if(p && confirm(`Remove "${p.name}" from the locker?`)){
        paints = paints.filter(x=>x.id!==b.dataset.id);
        await savePaints();
        render();
        showToast('Removed');
      }
    });
  });
}

function openForm(){
  document.getElementById('addForm').classList.add('open');
  document.getElementById('toggleForm').textContent = '− Close';
}
function toggleSwatchUI(finish){
  const disabled = finish !== 'standard';
  const colorInput = document.getElementById('fColor');
  const hexInput = document.getElementById('fColorHex');
  colorInput.disabled = disabled;
  hexInput.disabled = disabled;
}

function closeForm(){
  document.getElementById('addForm').classList.remove('open');
  document.getElementById('toggleForm').textContent = '+ Add paint';
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add a paint';
  document.getElementById('saveBtn').textContent = 'Save paint';
  document.getElementById('addForm').reset();
  document.getElementById('fColor').value = '#c9a227';
  document.getElementById('fColorHex').value = '#c9a227';
  document.getElementById('fFinish').value = 'standard';
  toggleSwatchUI('standard');
  document.getElementById('lookupStatus').textContent = '';
  document.getElementById('lookupStatus').className = 'lookup-status';
}

function openEdit(id){
  const p = paints.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  const finish = p.finish || (p.metallic ? 'metallic' : 'standard');
  document.getElementById('fName').value = p.name;
  document.getElementById('fBrand').value = p.brand;
  document.getElementById('fLine').value = p.line || '';
  document.getElementById('fPartNo').value = p.partNo || '';
  document.getElementById('fStatus').value = p.status;
  document.getElementById('fColor').value = p.color || '#c9a227';
  document.getElementById('fColorHex').value = p.color || '#c9a227';
  document.getElementById('fFinish').value = finish;
  toggleSwatchUI(finish);
  document.getElementById('fNotes').value = p.notes || '';
  document.getElementById('formTitle').textContent = 'Edit paint';
  document.getElementById('saveBtn').textContent = 'Update paint';
  openForm();
  document.getElementById('addForm').scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('toggleForm').addEventListener('click', ()=>{
  const form = document.getElementById('addForm');
  if(form.classList.contains('open')){
    closeForm();
  }else{
    openForm();
  }
});
document.getElementById('cancelForm').addEventListener('click', closeForm);

document.getElementById('fColor').addEventListener('input', (e)=>{
  document.getElementById('fColorHex').value = e.target.value;
});
document.getElementById('fColorHex').addEventListener('input', (e)=>{
  const v = e.target.value;
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    document.getElementById('fColor').value = v;
  }
});

document.getElementById('fPartNo').addEventListener('input', (e)=>{
  const status = document.getElementById('lookupStatus');
  const raw = e.target.value;
  if(!raw.trim()){
    status.textContent = '';
    status.className = 'lookup-status';
    return;
  }
  const match = lookupVallejo(raw);
  const brandField = document.getElementById('fBrand');
  const brandIsVallejoOrEmpty = !brandField.value.trim() || brandField.value.trim().toLowerCase() === 'vallejo';

  if(match && brandIsVallejoOrEmpty){
    brandField.value = 'Vallejo';
    document.getElementById('fLine').value = match.line;
    document.getElementById('fName').value = match.name;
    status.textContent = `Matched: ${match.name} (${match.line}) — check and edit if needed`;
    status.className = 'lookup-status match';
  }else if(match && !brandIsVallejoOrEmpty){
    status.textContent = `Matches Vallejo ${match.name} (${match.line}) — brand field isn't "Vallejo", left as-is`;
    status.className = 'lookup-status nomatch';
  }else{
    status.textContent = 'No Vallejo match — enter the rest manually';
    status.className = 'lookup-status nomatch';
  }
});

document.getElementById('fFinish').addEventListener('change', (e)=>{
  toggleSwatchUI(e.target.value);
});

document.getElementById('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  try{
    const name = document.getElementById('fName').value.trim();
    const brand = document.getElementById('fBrand').value.trim();
    const line = document.getElementById('fLine').value.trim();
    const partNo = document.getElementById('fPartNo').value.trim();
    const status = document.getElementById('fStatus').value;
    const finish = document.getElementById('fFinish').value;
    const color = document.getElementById('fColorHex').value.trim() || '#8a8a8a';
    const notes = document.getElementById('fNotes').value.trim();

    if(!name){
      showToast('Name is required');
      document.getElementById('fName').focus();
      return;
    }
    if(!brand){
      showToast('Brand is required');
      document.getElementById('fBrand').focus();
      return;
    }

    if(editingId){
      const p = paints.find(x=>x.id===editingId);
      if(!p){
        showToast('Could not find that paint to update');
        return;
      }
      Object.assign(p, {name, brand, line, partNo, status, finish, color, notes});
      delete p.metallic;
      showToast('Updated');
    }else{
      paints.push({id: uid(), name, brand, line, partNo, status, finish, color, notes});
      showToast('Added to locker');
    }
    await savePaints();
    closeForm();
    render();
  }catch(err){
    console.error('Save paint failed:', err);
    showToast('Something went wrong — try again');
  }
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterBrand').addEventListener('change', render);
document.getElementById('filterStatus').addEventListener('change', render);

document.getElementById('groupBrandBtn').addEventListener('click', ()=>{
  groupMode = 'brand';
  document.getElementById('groupBrandBtn').classList.add('active');
  document.getElementById('groupColorBtn').classList.remove('active');
  render();
});
document.getElementById('groupColorBtn').addEventListener('click', ()=>{
  groupMode = 'color';
  document.getElementById('groupColorBtn').classList.add('active');
  document.getElementById('groupBrandBtn').classList.remove('active');
  render();
});

window.addEventListener('error', (e)=>{
  console.error('Pigment Pantry error:', e.error || e.message);
  showToast('Something went wrong — check console');
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error('Pigment Pantry rejection:', e.reason);
  showToast('Something went wrong — check console');
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  try{
    const blob = new Blob([JSON.stringify(paints, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pigment-pantry-export.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Exported ${paints.length} paint${paints.length===1?'':'s'}`);
  }catch(err){
    console.error('Export failed:', err);
    showToast('Export failed — try again');
  }
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data)) throw new Error('File is not a paint list');

    const replace = confirm(
      `Import ${data.length} paint${data.length===1?'':'s'}?\n\n` +
      `OK = replace your current collection\nCancel = merge into your current collection`
    );

    if(replace){
      paints = data;
    }else{
      const existingIds = new Set(paints.map(p=>p.id));
      data.forEach(p=>{
        if(!p.id || existingIds.has(p.id)) p.id = uid();
        paints.push(p);
      });
    }
    paints.forEach(p=>{
      if(!p.finish){ p.finish = p.metallic ? 'metallic' : 'standard'; }
      delete p.metallic;
    });

    await savePaints();
    render();
    showToast(`Imported ${data.length} paint${data.length===1?'':'s'}`);
  }catch(err){
    console.error('Import failed:', err);
    showToast('Import failed — check the file');
  }
  e.target.value = '';
});

initTheme();
loadPaints();
</script>
</body>
</html>
